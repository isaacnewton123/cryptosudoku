library:
  name: cryptosudoku
  version: 0.1.0
  repository: cryptosudoku
  description: On-chain competitive Sudoku platform on BOT Chain.
  primary_framework: framework-agnostic
domains:
  - name: Hybrid architecture
    slug: architecture
    description: Off-chain play vs on-chain verification, UUPS upgrades, anti-cheat, FR-1..FR-7.
  - name: Tokenomics
    slug: tokenomics
    description: SUDO supply, allocations, vesting, revenue streams, staking.
skills:
  - name: cryptosudoku-architecture
    slug: cryptosudoku-architecture
    domain: architecture
    description: "Use when working on CryptoSudoku hybrid architecture: off-chain play vs on-chain verification, UUPS upgradeability, anti-cheat layers, or FR-1..FR-7 requirements. Covers Puzzle Registry, ZK Verifier, Leaderboard, and Appwrite integration."
    type: core
    covers:
      - CHAIN_ID / Puzzle Registry commitment order
      - UUPS + 48-hour timelock + multisig policy
      - FR-1..FR-7 requirement mapping
    tasks:
      - Verify a play flow against FR-1..FR-4 testnet loop
      - Implement a UUPS upgrade check with the 48-hour timelock
      - Confirm puzzle commitment precedes the play window
    failure_modes:
      - mistake: Treat off-chain scores as final
        mechanism: Only the on-chain Leaderboard is immutable and final.
        wrong_pattern: |
          await db.scores.update(winner);
        correct_pattern: |
          assertChain(chainId); // then record via Game Session + Leaderboard (FR-4)
        source: docs/03-product-architecture.md
        priority: CRITICAL
        status: active
      - mistake: Shorten or skip the upgrade timelock
        mechanism: UUPS upgrades require multisig plus a 48-hour public review.
        wrong_pattern: |
          upgrade(proxy, impl); // no timelock check
        correct_pattern: |
          approveUpgrade(timelockHours, multisigApproved); // enforces >= 48h + multisig
        source: docs/03-product-architecture.md
        priority: HIGH
        status: active
  - name: cryptosudoku-tokenomics
    slug: cryptosudoku-tokenomics
    domain: tokenomics
    description: "Use when working on SUDO tokenomics: supply, allocation table, vesting, revenue streams, or staking rewards. Enforces the PRD v1.1 allocation percentages and revenue-share (not emissions) model."
    type: core
    covers:
      - SUDO parameters (1B supply, ERC-20 Votes, BOT Chain 677)
      - PRD 4.2 allocation table and vesting
      - Revenue-share staking model
    tasks:
      - Validate the SUDO allocation table sums to 100%
      - Describe revenue-share staking without emissions
      - Review a tokenomics change against vesting and open questions
    failure_modes:
      - mistake: Fund staking APY from emissions
        mechanism: Yield comes from real platform revenue, not token emissions.
        wrong_pattern: |
          mint(rewards); // emissions-funded APY
        correct_pattern: |
          allocationTotal(TOKEN_ALLOCATIONS); // assert 100, pay from fee revenue
        source: docs/04-business-model-tokenomics.md
        priority: CRITICAL
        status: active
cross_references:
  - from: cryptosudoku-tokenomics
    to: cryptosudoku-architecture
    reason: Reward distribution (FR-5) and staking (FR-7) run on the architecture skill's contracts.
gaps: []
